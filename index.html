<!DOCTYPE html>

  <script>
    tailwind.config = {
      theme: {
        extend: {

  <style>
    /* 어르신 및 모바일 최적화: 가독성 극대화 및 줄바꿈 보정 */
    * {
      word-break: keep-all;
      overflow-wrap: break-word;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: linear-gradient(135deg, #fef9f3 0%, #edfbf7 100%);
      min-height: 100vh;
      color: #1f2937;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
    /* 진행도 바 부드러운 애니메이션 */
    .progress-bar-fill {
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* 버튼 탭 액티브 효과 */
    .btn-touch {
      transition: all 0.15s ease-out;
    }
    .btn-touch:active {
      transform: scale(0.97);
    }

</head>
<body class="font-sans antialiased text-gray-800 selection:bg-orange-200">

  <!-- 메인 반응형 컨테이너 -->
  <div id="app" class="max-w-xl mx-auto min-h-screen flex flex-col justify-between p-4 sm:p-6 shadow-xl bg-white/95 backdrop-blur-md">

    <!-- 1. 헤더 영역 (고정 안내 및 홈 버튼) -->
    <header class="pb-4 border-b border-orange-100 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="appState.goToHome()">
        <span class="text-3xl sm:text-4xl">🏡</span>
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-amber-900 tracking-tight">우리가족 마음쉼터</h1>

        </div>
      </div>
      <button id="headerResetBtn" onclick="appState.goToHome()" class="hidden text-sm bg-orange-100 text-orange-800 font-bold px-3 py-1.5 rounded-full hover:bg-orange-200">

    </main>

    <!-- 복사 완료 안내 토스트 알림 (모바일 맞춤) -->

      <span id="toastMessage">결과 링크가 복사되었습니다!</span>
    </div>

    <!-- 3. 푸터 영역 -->
    <footer class="pt-4 border-t border-gray-100 text-center text-xs text-gray-600 space-y-1">
      <p class="font-medium">이용후 님 · 이동애 님 · 이주희 님 · 이종석 님 전용 힐링 스페이스</p>
      <p class="text-[11px] text-gray-500">본 검사는 표준 심리생리 척도, MBTI 및 TCI(기질 및 성격검사) 이론을 융합한 가족 맞춤형 임상 분석 엔진입니다.</p>
    </footer>

  </div>

  <script>

        mbtiDefault: "ENFJ",
        tciDefault: { NS: "고(High)", HA: "중저(Mid-Low)", RD: "고(High)", P: "고(High)", SD: "고(High)", CO: "고(High)", ST: "중(Mid)" },

    /* ========================================================
       가족별 실제 검사 완료 데이터 저장소 (LocalStorage 동기화)
       ======================================================== */
    const STORAGE_KEY = 'family_clinic_records_v1';
    function loadSavedRecords() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : {};
      } catch (e) {
        return {};
      }
    }
    function saveMemberRecord(memberId, results) {
      try {
        const records = loadSavedRecords();
        records[memberId] = {
          completedAt: new Date().toLocaleDateString('ko-KR'),
          results: results
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      } catch (e) {
        console.error(e);
      }
    }

    /* ========================================================
       3. 애플리케이션 상태 관리

    const appState = {
      currentView: 'home', // 'home' | 'intro' | 'survey' | 'result'
      currentMember: null,
      currentQuestionIdx: 0,
      answers: {}, // { questionId: score (1~5) }
      chartInstance: null,
      cachedResult: null,
      isSharedView: false,

      init() {
        // 공유 링크로 접속했는지 확인 (URL 해시 #share=...)
        if (this.checkSharedUrl()) {
          return;
        }
        this.render();
      },

      // 공유 URL 감지 및 복원 로직
      checkSharedUrl() {
        try {
          const hash = window.location.hash;
          if (hash && hash.startsWith('#share=')) {
            const encodedData = hash.replace('#share=', '');
            const decodedJson = decodeURIComponent(escape(atob(encodedData)));
            const payload = JSON.parse(decodedJson);

            if (payload && payload.memberId && FAMILY_MEMBERS[payload.memberId]) {
              this.currentMember = FAMILY_MEMBERS[payload.memberId];
              this.cachedResult = payload.results;
              this.isSharedView = true;
              this.currentView = 'result';
              this.render();
              return true;
            }
          }
        } catch (e) {
          console.error("공유 데이터 복원 실패:", e);
        }
        return false;
      },

      // 공유 링크 생성 및 클립보드 복사
      copyShareLink() {
        const res = this.cachedResult || this.calculateResults();
        const payload = {
          memberId: this.currentMember.id,
          results: res
        };

        const jsonString = JSON.stringify(payload);
        const encodedData = btoa(unescape(encodeURIComponent(jsonString)));
        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = `${baseUrl}#share=${encodedData}`;

        // 클립보드 복사 (모바일 iFrame 및 보안 브라우저 대응)
        const dummyInput = document.createElement('textarea');
        dummyInput.value = shareUrl;
        dummyInput.style.position = 'fixed';
        dummyInput.style.opacity = '0';
        document.body.appendChild(dummyInput);
        dummyInput.focus();
        dummyInput.select();

        let success = false;
        try {
          success = document.execCommand('copy');
        } catch (err) {
          success = false;
        }
        document.body.removeChild(dummyInput);

        if (success) {
          this.showToast("🔗 검사 결과 링크가 복사되었습니다! 가족에게 보내보세요.");
        } else {
          this.showToast("링크 복사에 실패했습니다. 브라우저 주소를 직접 복사해주세요.");
        }
      },

      showToast(message) {
        const toast = document.getElementById('toastAlert');
        const toastMsg = document.getElementById('toastMessage');
        if (!toast || !toastMsg) return;
        toastMsg.innerText = message;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');
        setTimeout(() => {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0', 'pointer-events-none');
        }, 3000);
      },

      selectMember(memberId) {
        this.currentMember = FAMILY_MEMBERS[memberId];
        this.currentQuestionIdx = 0;
        this.answers = {};
        this.currentView = 'intro';
        this.render();
      },

      startSurvey() {
        this.currentView = 'survey';
        this.currentQuestionIdx = 0;
        this.answers = {};
        this.render();
      },

      answerQuestion(score) {
        const q = QUESTION_BANK[this.currentQuestionIdx];
        this.answers[q.id] = score;

        if (this.currentQuestionIdx < QUESTION_BANK.length - 1) {
          this.currentQuestionIdx++;
          this.render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          this.finishSurvey();
        }
      },

      prevQuestion() {
        if (this.currentQuestionIdx > 0) {
          this.currentQuestionIdx--;
          this.render();
        }
      },

      finishSurvey() {
        this.currentView = 'result';
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      goToHome() {
        if (this.chartInstance) {
          this.chartInstance.destroy();
          this.chartInstance = null;
        }
        // 공유 해시 제거하여 홈으로 복원
        if (window.location.hash) {
          history.replaceState(null, '', window.location.pathname);
        }
        this.isSharedView = false;
        this.currentView = 'home';
        this.currentMember = null;
        this.currentQuestionIdx = 0;
        this.answers = {};
        this.render();
      },

      render() {
        const main = document.getElementById('mainContent');
        const headerResetBtn = document.getElementById('headerResetBtn');

        if (this.currentView === 'home') {
          headerResetBtn.classList.add('hidden');
          main.innerHTML = this.renderHomeView();
        } else if (this.currentView === 'intro') {
          headerResetBtn.classList.remove('hidden');
          main.innerHTML = this.renderIntroView();
        } else if (this.currentView === 'survey') {
          headerResetBtn.classList.remove('hidden');
          main.innerHTML = this.renderSurveyView();
        } else if (this.currentView === 'result') {
          headerResetBtn.classList.remove('hidden');
          main.innerHTML = this.renderResultView();
          this.initResultChart();
        }
      },

      /* ----------------------------------------------------
         점수 계산 및 검사 결과 도출
         ---------------------------------------------------- */
      calculateResults() {
        const ans = this.answers;
        const m = this.currentMember;

        let tensionRaw = 0, tensionCnt = 0;
        let depressRaw = 0, depressCnt = 0;
        let somaticRaw = 0, somaticCnt = 0;
        let famStressRaw = 0, famStressCnt = 0;
        let eiScore = 0, snScore = 0, tfScore = 0, jpScore = 0;

        let nsScore = 0, haScore = 0, rdScore = 0, pScore = 0;
        let sdScore = 0, coScore = 0, stScore = 0;

        QUESTION_BANK.forEach(q => {
          const val = ans[q.id] || 3;
          if (q.category === 'bio_tension') { tensionRaw += val; tensionCnt++; }
          if (q.category === 'bio_depress') { depressRaw += val; depressCnt++; }
          if (q.category === 'bio_somatic') { somaticRaw += val; somaticCnt++; }
          if (q.category === 'bio_load') { somaticRaw += val; somaticCnt++; }
          if (q.category === 'fam_stress') { famStressRaw += val; famStressCnt++; }

          if (q.category === 'mbti_EI') eiScore += val;
          if (q.category === 'mbti_SN') snScore += val;
          if (q.category === 'mbti_TF') tfScore += val;
          if (q.category === 'mbti_JP') jpScore += val;

          if (q.category === 'tci_NS') nsScore += val;
          if (q.category === 'tci_HA') haScore += val;
          if (q.category === 'tci_RD') rdScore += val;
          if (q.category === 'tci_RD_REV') rdScore += (6 - val);
          if (q.category === 'tci_P') pScore += val;
          if (q.category === 'tci_SD') sdScore += val;
          if (q.category === 'tci_CO') coScore += val;
          if (q.category === 'tci_ST') stScore += val;
        });

        const tension = Math.min(100, Math.round(((tensionRaw / (tensionCnt || 1)) / 5) * 100));
        const somatic = Math.min(100, Math.round(((somaticRaw / (somaticCnt || 1)) / 5) * 100));
        const depression = Math.min(100, Math.round(((depressRaw / (depressCnt || 1)) / 5) * 100));
        const stress = Math.min(100, Math.round(((famStressRaw / (famStressCnt || 1)) / 5) * 100));
        const resilience = Math.max(30, 100 - Math.round((tension + stress + depression) / 3 * 0.7));

        const mbti = (eiScore >= 24 ? "I" : "E") +
                     (snScore >= 24 ? "S" : "N") +
                     (tfScore >= 28 ? "T" : "F") +
                     (jpScore >= 28 ? "J" : "P");

        const getTciLevel = (score, max) => {
          const ratio = score / max;
          if (ratio >= 0.8) return "초고(Very High)";
          if (ratio >= 0.65) return "고(High)";
          if (ratio >= 0.45) return "중(Mid)";
          if (ratio >= 0.3) return "중저(Mid-Low)";
          return "저(Low)";
        };

        const tci = {
          NS: getTciLevel(nsScore, 20),
          HA: getTciLevel(haScore, 25),
          RD: getTciLevel(rdScore, 20),
          P: getTciLevel(pScore, 15),
          SD: getTciLevel(sdScore, 15),
          CO: getTciLevel(coScore, 15),
          ST: getTciLevel(stScore, 15)
        };

        return {
          scores: {
            '자율신경 긴장도': tension,
            '신체화 반응': somatic,
            '정서 침체도': depression,
            '가족 스트레스': stress,
            '심리적 회복탄력성': resilience
          },
          mbti: mbti || m.mbtiDefault,
          tci: tci
        };
      },

      finishSurvey() {
        const results = this.calculateResults();
        saveMemberRecord(this.currentMember.id, results);
        this.cachedResult = results;
        this.currentView = 'result';
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      /* ----------------------------------------------------

      generateEmpathyLetter(m) {

      /* ----------------------------------------------------
         상담사의 3대 실천 처방전 (내려놓을 것 & 시도할 것)
         - 실측 MBTI, TCI 7대 기질, 심리생리 수치를 결합한 완전 동적 엔진
         ---------------------------------------------------- */
      generateSuggestions(m, res) {
        const tci = res.tci;
        const mbti = res.mbti;
        const scores = res.scores;

        const levelScore = (lvl) => {
          if (!lvl) return 3;
          if (lvl.includes('초고')) return 5;
          if (lvl.includes('고')) return 4;
          if (lvl.includes('중저')) return 2;
          if (lvl.includes('저')) return 1;
          return 3;
        };

        const haLvl = levelScore(tci.HA);
        const rdLvl = levelScore(tci.RD);
        const nsLvl = levelScore(tci.NS);
        const sdLvl = levelScore(tci.SD);
        const pLvl = levelScore(tci.P);
        const tensionScore = scores['자율신경 긴장도'] || 50;
        const somaticScore = scores['신체화 반응'] || 50;

        // 1. 내려놓을 것 (TCI 취약 축 & 심리생리 긴장도 기반 동적 처방)
        let releaseList = [];
        if (haLvl >= 4) {
          releaseList.push(`[위험회피(${tci.HA}) 진단] '혹시 나쁜 일이 생기면 어쩌지'라며 아직 오지 않은 미래를 미리 앞당겨 괴로워하는 <strong>예기불안과 통제 강박</strong>`);
        } else if (haLvl <= 2) {
          releaseList.push(`[위험회피(${tci.HA}) 진단] 내 몸의 피로 신호를 무시하고 '이 정도쯤이야' 하며 한계치까지 밀어붙이는 <strong>과도한 낙관과 무리한 버팀</strong>`);
        }

        if (rdLvl >= 4) {
          <div class="p-4 bg-amber-100/70 rounded-2xl border border-amber-100 space-y-2 shadow-sm">
            <p class="font-bold text-amber-900 text-sm sm:text-base flex items-center">
              <span class="mr-1.5">☕</span> 3. 일상 속 몸·마음 챙김 루틴
            </p>
            <p class="text-sm sm:text-base text-gray-800 font-medium leading-relaxed">${routineItem}</p>
          </div>
        `;
      },

      /* ----------------------------------------------------
         TCI 기질별 상황 상호작용 심층 서술 (실측 점수 기반 완전 동적 엔진)
         - 실제 검사에서 도출된 TCI 7대 척도(NS, HA, RD, P, SD, CO, ST)의 
           강점 축과 취약 축을 실시간 판별하여 개인 맞춤형 문장 생성
         ---------------------------------------------------- */
      renderTciSituationInsight(member, tci) {
        const levelScore = (lvl) => {
          if (!lvl) return 3;
          if (lvl.includes('초고')) return 5;
          if (lvl.includes('고')) return 4;
          if (lvl.includes('중저')) return 2;
          if (lvl.includes('저')) return 1;
          return 3;
        };

        const ns = levelScore(tci.NS);
        const ha = levelScore(tci.HA);
        const rd = levelScore(tci.RD);
        const p  = levelScore(tci.P);
        const sd = levelScore(tci.SD);
        const co = levelScore(tci.CO);
        const st = levelScore(tci.ST);

        // 1. 강점 축 도출 (왜 견뎌낼 수 있었는가)
        let strengthDrivers = [];
        if (p >= 4) {
          strengthDrivers.push(`<strong>극단적인 인내력[P: ${tci.P}]</strong>: 육체적 피로와 정신적 고립 앞에서도 책임을 완수해 내는 강철 같은 끈기`);
        }
        if (sd >= 4) {
          strengthDrivers.push(`<strong>높은 자율성[SD: ${tci.SD}]</strong>: 주변의 환경이나 결핍에 휘둘리지 않고 스스로 인생의 주도권을 쥐려는 자아 탄력성`);
        }
        if (co >= 4) {
          strengthDrivers.push(`<strong>따뜻한 연대감[CO: ${tci.CO}]</strong>: 아무리 힘겨워도 가족과 타인을 버리지 않고 품어 안으려는 이타적 공감 능력`);
        }
        if (st >= 4) {
          strengthDrivers.push(`<strong>초연한 자기초월[ST: ${tci.ST}]</strong>: 삶의 시련과 상처를 자연과 운명, 영적인 섭리 속에서 승화해내는 깊은 마음의 그릇`);
        }
        if (ns >= 4) {
          strengthDrivers.push(`<strong>도전적인 자극추구[NS: ${tci.NS}]</strong>: 답답한 현실에 갇히지 않고 새로운 세상과 기회를 열어가려는 개척자적 에너지`);
        }
        if (ha <= 2) {
          strengthDrivers.push(`<strong>낮은 위험회피[HA: ${tci.HA}]</strong>: 위험이나 미래의 불확실성에 주눅 들지 않고 일단 부딪쳐보는 대범함과 배짱`);
        }

        // 강점 기본값 보정
        if (strengthDrivers.length === 0) {
          strengthDrivers.push(`<strong>균형 잡힌 적응력</strong>: 어느 한쪽으로 치우치지 않고 묵묵히 일상을 견뎌내는 내면의 방어력`);
        }

        // 2. 취약 축 도출 (왜 이 상황에서 유독 더 고통스러웠는가)
        let vulnerabilityDrivers = [];
        if (ha >= 4) {
          vulnerabilityDrivers.push(`<strong>극심한 위험회피[HA: ${tci.HA}]</strong>: 아직 오지 않은 불행이나 건강 악화를 끊임없이 염려하며 자율신경계가 항상 비상 대기 상태로 긴장하는 예기불안`);
        }
        if (rd >= 4) {
          vulnerabilityDrivers.push(`<strong>높은 사회적 보상의존[RD: ${tci.RD}]</strong>: 상대방의 다정한 반응과 인정이 결핍될 때 '내가 거절당했다'는 깊은 애착 손상과 서러움`);
        } else if (rd <= 2) {
          vulnerabilityDrivers.push(`<strong>극도로 낮은 보상의존[RD: ${tci.RD}]</strong>: 슬픔이나 고통을 나눌 줄 모르고 '나 혼자 삭이면 된다'며 마음의 빗장을 걸어 잠그는 정서적 고립`);
        }
        if (p >= 4 && sd <= 3) {
          vulnerabilityDrivers.push(`<strong>가혹한 완벽주의와 자기채찍질[P: ${tci.P}]</strong>: 모든 짐을 홀로 짊어져야 한다는 강박으로 신체가 무너질 때까지 스스로를 몰아세운 한계 초과`);
        }
        if (sd <= 2) {
          vulnerabilityDrivers.push(`<strong>위축된 자율성[SD: ${tci.SD}]</strong>: 불가항력적인 환경이나 가족의 아픔 앞에서 '모든 것이 내 탓'이라는 무력감과 자책감`);
        }
        if (co <= 2) {
          vulnerabilityDrivers.push(`<strong>낮은 연대감[CO: ${tci.CO}]</strong>: 타인의 서툰 행동이나 의견 차이를 너그럽게 넘기지 못하고 속으로 날 선 비판과 냉담함을 쌓아두는 피로`);
        }

        // 취약 기본값 보정
        if (vulnerabilityDrivers.length === 0) {
          vulnerabilityDrivers.push(`<strong>기질 간 긴장 완충 부족</strong>: 감정 표현의 서툼으로 인해 내면의 스트레스를 제때 환기하지 못하는 정서적 답답함`);
        }

        // 3. 가족별 고유 배경 맥락과의 융합 서술
        let contextStrength = "";
        let contextVulnerability = "";

        if (member.id === 'father') {
          contextStrength = `영천 농가 출신으로 원양어선의 거친 파도와 회사 현장의 중압감을 버텨내며 자수성가를 이룬 밑바탕에는 바로 이 기질적 자원이 결정적 버팀목이 되었습니다.`;
          contextVulnerability = `하지만 처가와의 오랜 갈등이나 가족의 아픔을 마주했을 때, 감정을 표현하거나 위로받지 못한 채 홀로 봉화에서 고독을 삼켜야 했던 것은 이 취약성이 작용했기 때문입니다.`;
        } else if (member.id === 'mother') {
          contextStrength = `쌍둥이 시절의 상처와 큰딸 주희 씨를 돌보는 기나긴 헌신의 세월 속에서도 가정을 끝까지 지켜낼 수 있었던 것은 이 따뜻하고 숭고한 내면의 힘 덕분이었습니다.`;
          contextVulnerability = `남편과의 소원해진 관계, 처가 식구들과의 불화 속에서 가슴속 불안과 긴장이 풀리지 않고 신체화(위장장애, 불면)로 이어졌던 근본 원인은 바로 이 기질적 통증 때문이었습니다.`;
        } else if (member.id === 'daughter') {
          contextStrength = `신체적 시련과 외로운 학창시절을 겪으면서도 빗나가지 않고 요양병원에서 묵묵히 타인을 도우며 성실하게 살아올 수 있었던 순수한 자산입니다.`;
          contextVulnerability = `새로운 사람이나 환경에 대한 공포가 크고, 혼담 상대의 갑작스러운 사망이라는 비극 앞에서 세상 밖으로 마음을 열지 못하고 어머니 곁에 머물며 위축된 배경이기도 합니다.`;
        } else {
          contextStrength = `가족의 무거운 공기 속에서도 주눅 들지 않고 해외 인턴십과 다양한 도전을 해내며 가족의 든든한 희망으로 우뚝 설 수 있었던 핵심 동력입니다.`;
          contextVulnerability = `하지만 '내가 부모님의 기대에 부응하고 가족의 매듭을 풀어야 한다'는 무거운 구원자 콤플렉스를 짊어진 채, 혼자 번아웃을 감내해야 했던 내적 원인이 바로 여기에 있습니다.`;
        }

        return `
          <div class="space-y-3">
            <div class="p-4 bg-white/90 rounded-2xl border border-indigo-200 shadow-sm space-y-2">
              <div class="flex items-center justify-between">
                <p class="text-indigo-950 font-black text-sm sm:text-base flex items-center">
                  <span class="mr-1.5">💪</span> [실측 기질] 왜 모진 세월을 견뎌낼 수 있었는가? (기질의 강점)
                </p>
                <span class="text-xs px-2 py-0.5 bg-indigo-100 text-indigo-800 font-bold rounded">실측 데이터 기반</span>
              </div>
              <ul class="text-sm sm:text-base text-gray-800 font-medium leading-relaxed space-y-1.5 list-disc list-inside">
                ${strengthDrivers.map(d => `<li>${d}</li>`).join('')}
              </ul>
              <p class="text-xs sm:text-sm text-indigo-900 pt-1 font-semibold border-t border-indigo-50">
                👉 ${contextStrength}
              </p>
            </div>

            <div class="p-4 bg-white/90 rounded-2xl border border-rose-200 shadow-sm space-y-2">
              <div class="flex items-center justify-between">
                <p class="text-rose-950 font-black text-sm sm:text-base flex items-center">
                  <span class="mr-1.5">⚠️</span> [실측 기질] 왜 이 상황에서 유독 더 고통스러웠는가? (기질의 그늘)
                </p>
                <span class="text-xs px-2 py-0.5 bg-rose-100 text-rose-800 font-bold rounded">실측 데이터 기반</span>
              </div>
              <ul class="text-sm sm:text-base text-gray-800 font-medium leading-relaxed space-y-1.5 list-disc list-inside">
                ${vulnerabilityDrivers.map(d => `<li>${d}</li>`).join('')}
              </ul>
              <p class="text-xs sm:text-sm text-rose-900 pt-1 font-semibold border-t border-rose-50">
                👉 ${contextVulnerability}
              </p>
            </div>
          </div>
        `;
      },

      },

      /* ----------------------------------------------------
         Chart.js 레이더 차트 렌더러
         ---------------------------------------------------- */
      initResultChart() {
        setTimeout(() => {
          const ctx = document.getElementById('bioChart');
          if (!ctx) return;
          if (this.chartInstance) {
            this.chartInstance.destroy();
          }

          const res = this.cachedResult || this.calculateResults();
          const labels = Object.keys(res.scores);
          const dataValues = Object.values(res.scores);

          this.chartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
              labels: labels,
              datasets: [{
                label: `${this.currentMember.name} 님의 심리생리 상태`,
                data: dataValues,
                backgroundColor: 'rgba(249, 115, 22, 0.2)',
                borderColor: 'rgba(234, 88, 12, 1)',
                pointBackgroundColor: 'rgba(234, 88, 12, 1)',
                pointBorderColor: '#fff',
                pointHoverBackgroundColor: '#fff',
                pointHoverBorderColor: 'rgba(234, 88, 12, 1)',
                borderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              scales: {
                r: {
                  angleLines: { color: '#e5e7eb' },
                  grid: { color: '#e5e7eb' },
                  suggestedMin: 0,
                  suggestedMax: 100,
                  ticks: { stepSize: 20, display: false },
                  pointLabels: {
                    font: { size: 12, weight: 'bold' },
                    color: '#374151'
                  }
                }
              },
              plugins: {
                legend: { display: false }
              }
            }
          });
        }, 50);
      },

      /* ----------------------------------------------------
         가족 1:1 관계 역동 (TCI 기질 갈등 예측 심화 및 실측/추정 상태 표기)
         ---------------------------------------------------- */
      renderRelationships(currentId, myMbti) {
        const others = Object.values(FAMILY_MEMBERS).filter(m => m.id !== currentId);
        const records = loadSavedRecords();
        const myRes = this.cachedResult || this.calculateResults();

        return others.map(target => {
          const targetRecord = records[target.id];
          const isTargetDone = !!targetRecord;
          
          // 상대방의 TCI 및 MBTI (실측치가 있으면 실측치, 없으면 기본 추정치 사용)
          const targetTci = isTargetDone ? targetRecord.results.tci : target.tciDefault;
          const targetMbti = isTargetDone ? targetRecord.results.mbti : target.mbtiDefault;

          // 완전히 동적으로 계산되는 관계 분석 생성기 호출
          const relationData = this.generateDynamicRelationInsight(
            this.currentMember,
            myRes,
            target,
            { tci: targetTci, mbti: targetMbti, isReal: isTargetDone }
          );

          return `
            <div class="bg-white rounded-3xl p-5 sm:p-6 border border-gray-200 shadow-sm space-y-4">
              <div class="flex items-center justify-between border-b pb-3 border-gray-100 flex-wrap gap-2">
                <div class="flex items-center space-x-3">
                  <span class="text-3xl">${target.avatar}</span>
                  <div>
                    <h4 class="text-lg sm:text-xl font-black text-gray-900">${target.name} 님과의 관계 처방</h4>
                    <span class="text-xs font-bold text-gray-500">${target.role} (${target.birth})</span>
                  </div>
                </div>
                
                <!-- 상대방 검사 상태 뱃지 -->
                ${isTargetDone ? `
                  <span class="text-xs font-extrabold px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300 flex items-center">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-600 mr-1.5"></span>
                    양측 실측 데이터 매칭
                  </span>
                ` : `
                  <div class="flex items-center space-x-2">
                    <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-gray-100 text-gray-700 border border-gray-300">
                      임상 배경 추정치
                    </span>
                    <button onclick="appState.selectMember('${target.id}')" class="text-xs font-bold text-orange-600 underline hover:text-orange-800">
                      검사받기 ➔
                    </button>
                  </div>
                `}
              </div>

              <!-- TCI 기질 지표 비교 미니 바 -->
              <div class="p-3 bg-gray-50 rounded-2xl border border-gray-200 text-xs text-gray-700 flex justify-between items-center">
                <div class="space-x-1">
                  <span class="font-bold text-gray-900">${this.currentMember.name}:</span>
                  <span class="text-purple-700 font-bold">${myRes.mbti} (실측)</span>
                </div>
                <div class="text-gray-400 font-bold">vs</div>
                <div class="space-x-1">
                  <span class="font-bold text-gray-900">${target.name}:</span>
                  <span class="${isTargetDone ? 'text-emerald-700 font-bold' : 'text-amber-700 font-bold'}">
                    ${targetMbti} (${isTargetDone ? '실측치' : '검사 전 추정'})
                  </span>
                </div>
              </div>

              <!-- 미검사 상태일 때의 주의 안내 배너 -->
              ${!isTargetDone ? `
                <div class="p-3 bg-amber-100/70 rounded-xl border border-amber-300 text-xs text-amber-950 space-y-1">
                  <span class="font-bold">⚠️ ${target.name} 님이 아직 검사를 진행하지 않았습니다.</span>
                  <p class="leading-relaxed text-gray-700">
                    현재 처방은 ${target.name} 님의 성장 배경에 따른 임시 추정치입니다. 실제 성향과 차이가 있을 수 있으므로, <strong>${target.name} 님이 직접 75문항을 풀면 오차 없이 100% 실측 맞춤 처방으로 즉시 갱신</strong>됩니다.
                  </p>
                </div>
              ` : ''}

              <!-- TCI 기질 충돌 예측 -->
              <div class="p-4 bg-purple-50/70 rounded-2xl border border-purple-200 space-y-1">
                <p class="text-sm font-extrabold text-purple-950 flex items-center">
                  <span class="mr-1.5">⚡</span> ${isTargetDone ? '실측 기질' : '잠정 기질'} 기반 갈등 예측 & 메커니즘
                </p>
                <p class="text-sm sm:text-base text-gray-800 font-medium leading-relaxed">
                  ${relationData.tciClash}
                </p>
              </div>

              <!-- 마찰 포인트 -->
              <div class="p-4 bg-rose-50/80 rounded-2xl border border-rose-100 space-y-1">
                <p class="text-sm font-extrabold text-rose-900 flex items-center">
                  <span class="mr-1.5">🔥</span> 구체적 마찰 원인 (${isTargetDone ? '실측 데이터 산출' : '임상 배경 추정 대입'})
                </p>
                <p class="text-sm sm:text-base text-gray-800 font-medium leading-relaxed">
                  ${relationData.friction}
                </p>
              </div>

              <!-- 잘 맞는 점 (상호보완) -->
              <div class="p-4 bg-emerald-50/80 rounded-2xl border border-emerald-100 space-y-1">
                <p class="text-sm font-extrabold text-emerald-900 flex items-center">
                  <span class="mr-1.5">✨</span> 서로 잘 맞는 점 & 상호보완
                </p>
                <p class="text-sm sm:text-base text-gray-800 font-medium leading-relaxed">
                  ${relationData.synergy}
                </p>
              </div>

              <!-- 해결책 & 실천 제안 -->
              <div class="p-4 bg-amber-50/80 rounded-2xl border border-amber-200 space-y-1">
                <p class="text-sm font-extrabold text-amber-950 flex items-center">
                  <span class="mr-1.5">💡</span> ${isTargetDone ? '정밀 실측 맞춤 솔루션 & 대화 처방' : '임시 완충 솔루션 (검사 완료 시 정밀 전환)'}
                </p>
                <div class="text-sm sm:text-base text-gray-800 font-medium leading-relaxed">
                  ${relationData.solution}
                </div>
              </div>
            </div>
          `;
        }).join('');
      },

      /* ----------------------------------------------------
         [정밀 고도화 엔진] 실제 검사치 vs 미검사 추정치를 엄격히 분기하고
         TCI 7대 지표 & MBTI 4축 & 생애 배경을 입체 결합한 동적 처방 생성기
         ---------------------------------------------------- */
      generateDynamicRelationInsight(me, myRes, target, targetData) {
        const myTci = myRes.tci;
        const otherTci = targetData.tci;
        const myMbti = myRes.mbti;
        const otherMbti = targetData.mbti;
        const isReal = targetData.isReal; // 상대방 실제 검사 완료 여부

        const levelScore = (lvl) => {
          if (!lvl) return 3;
          if (lvl.includes('초고')) return 5;
          if (lvl.includes('고')) return 4;
          if (lvl.includes('중저')) return 2;
          if (lvl.includes('저')) return 1;
          return 3;
        };

        const myNS = levelScore(myTci.NS), otNS = levelScore(otherTci.NS);
        const myHA = levelScore(myTci.HA), otHA = levelScore(otherTci.HA);
        const myRD = levelScore(myTci.RD), otRD = levelScore(otherTci.RD);
        const myP  = levelScore(myTci.P),  otP  = levelScore(otherTci.P);
        const mySD = levelScore(myTci.SD), otSD = levelScore(otherTci.SD);
        const myCO = levelScore(myTci.CO), otCO = levelScore(otherTci.CO);
        const myST = levelScore(myTci.ST), otST = levelScore(otherTci.ST);

        const myE_I = myMbti[0], otE_I = otherMbti[0];
        const myS_N = myMbti[1], otS_N = otherMbti[1];
        const myT_F = myMbti[2], otT_F = otherMbti[2];
        const myJ_P = myMbti[3], otJ_P = otherMbti[3];

        // 1. TCI 기반 갈등 예측 & 메커니즘
        let tciClash = "";
        if (!isReal) {
          tciClash = `[잠정 기질 대조] ${me.name} 님의 실측치(위험회피 ${myTci.HA}, 보상의존 ${myTci.RD}, 인내력 ${myTci.P})와 ${target.name} 님의 기본 성향 프로파일을 교차 분석한 결과입니다. ${target.name} 님이 직접 검사를 완료하지 않은 상태이므로, 예상치 못한 기질 편차(예: 겉으로는 침묵하지만 속으로는 보상의존이 높거나, 겉으로는 순응하지만 자율성 욕구가 큰 경우)가 존재할 수 있습니다. 현재로서는 ${target.name} 님의 반응 속도와 방어기제를 자극하지 않는 안전한 소통이 선행되어야 합니다.`;
        } else {
          // 양측 모두 실제 검사 완료 시: 다차원 기질 격차 조합 계산
          if (Math.abs(myRD - otRD) >= 2) {
            const highRd = myRD > otRD ? me.name : target.name;
            const lowRd = myRD > otRD ? target.name : me.name;
            tciClash = `【정서적 보상의존(RD) 불균형 - 실측 검증】 ${me.name} 님은 [${myTci.RD}], ${target.name} 님은 [${otherTci.RD}]로 실측되었습니다. ${highRd} 님은 따뜻한 호응과 정서적 교감을 관계의 생명선으로 여기는 반면, ${lowRd} 님은 감정의 필요성을 크게 느끼지 못하거나 실질적 해결책에 집중합니다. 이로 인해 ${highRd} 님은 "벽을 보고 이야기하는 것 같다"는 거절감을, ${lowRd} 님은 "이유 없이 감정적으로 보채거나 서운해한다"는 피로감을 느끼는 기질적 악순환이 발생합니다.`;
          } else if (myHA >= 4 && otHA >= 4) {
            tciClash = `【위험회피(HA) 상호 과각성 - 실측 검증】 두 분 모두 위험회피가 [${myTci.HA}]와 [${otherTci.HA}]로 고/초고 수준입니다. 사소한 건강 문제나 금전, 가족 미래의 불확실성이 수면 위로 올라왔을 때 한 사람이 불안을 표출하면, 상대방이 이를 가라앉혀주는 것이 아니라 함께 위기감을 증폭시키며 서로를 날 선 말로 방어하거나 불안을 회피하려 집을 비우는 등의 신체화 반응으로 이어집니다.`;
          } else if (myP >= 4 && otP >= 4 && mySD >= 4 && otSD >= 4) {
            tciClash = `【인내력(P)과 자율성(SD)의 신념 대립 - 실측 검증】 두 분 모두 인내력([${myTci.P}] vs [${otherTci.P}])과 자율성([${myTci.SD}] vs [${otherTci.SD}])이 매우 강해, 스스로 옳다고 믿는 삶의 방식과 가족관에 대해 타협하지 않는 '고집스러운 평행선'을 달리기 쉽습니다. 서로를 존경하면서도 자존심 때문에 먼저 손을 내밀지 못하는 상태가 장기화될 수 있습니다.`;
          } else if (Math.abs(myNS - otNS) >= 2) {
            const highNs = myNS > otNS ? me.name : target.name;
            const lowNs = myNS > otNS ? target.name : me.name;
            tciClash = `【자극추구(NS) 삶의 템포 불일치 - 실측 검증】 ${highNs} 님의 높은 모험·변화 지향성과 ${lowNs} 님의 극단적인 안정·보수 지향성이 부딪힙니다. 삶의 방향성이나 경제적 결정, 일상 계획에서 "왜 그렇게 불안정하게 일을 벌이느냐" vs "왜 그렇게 꽉 막혀 제자리에만 머무느냐"는 가치관 충돌이 일어납니다.`;
          } else {
            tciClash = `【내면의 피로도와 완벽주의 마찰 - 실측 검증】 두 분의 기질 척도가 비교적 고르게 분포되어 있으나, 스트레스 상황 시 각자의 에너지 소진 방식(침묵 대처 vs 불만 토로)이 달라 정서적 엇갈림이 일어납니다.`;
          }
        }

        // 2. 구체적 마찰 원인 (MBTI 4축 + 실제 가족 서사 결합)
        let mbtiFrictionPoints = [];
        if (myT_F !== otT_F) {
          const tPerson = myT_F === 'T' ? me.name : target.name;
          const fPerson = myT_F === 'F' ? me.name : target.name;
          mbtiFrictionPoints.push(`• <strong>[사고(T) vs 감정(F)]</strong>: ${tPerson} 님은 논리적 사실과 문제 해결을 서둘러 제시하려 하고, ${fPerson} 님은 그 과정에서 겪은 마음의 아픔과 서러움을 먼저 알아주길 바랍니다. "옳은 말이지만 듣는 사람에겐 비수가 되는 대화"가 반복될 수 있습니다.`);
        } else if (myT_F === 'T') {
          mbtiFrictionPoints.push(`• <strong>[사고(T) vs 사고(T)]</strong>: 두 분 모두 감정 표현보다 정합성과 책임을 앞세워, 갈등 시 서로 차가운 논리로 반박하거나 냉담한 침묵으로 일관하여 마음의 거리가 좁혀지지 않습니다.`);
        } else {
          mbtiFrictionPoints.push(`• <strong>[감정(F) vs 감정(F)]</strong>: 서로의 상처를 너무 깊이 염려한 나머지, 진작 꺼내어 풀어야 할 진짜 속마음을 숨긴 채 겉도는 위로만 건네다 가슴속 응어리가 누적됩니다.`);
        }

        if (myJ_P !== otJ_P) {
          const jPerson = myJ_P === 'J' ? me.name : target.name;
          const pPerson = myJ_P === 'P' ? me.name : target.name;
          mbtiFrictionPoints.push(`• <strong>[판단(J) vs 인식(P)]</strong>: 계획과 예측 가능성을 철저히 지키려는 ${jPerson} 님과, 상황에 맞게 유연하게 흘러가려는 ${pPerson} 님 사이에서 약속이나 일상 정돈 방식을 둘러싼 피로감이 발생합니다.`);
        }

        if (myE_I !== otE_I) {
          const ePerson = myE_I === 'E' ? me.name : target.name;
          const iPerson = myE_I === 'I' ? me.name : target.name;
          mbtiFrictionPoints.push(`• <strong>[외향(E) vs 내향(I)]</strong>: 갈등이 발생했을 때 ${ePerson} 님은 대화와 바깥 활동으로 즉시 풀고자 하지만, ${iPerson} 님은 동굴 속에 들어가 혼자만의 시간을 확보해야 감정이 가라앉는 리듬의 차이가 있습니다.`);
        }

        const friction = mbtiFrictionPoints.join('<br class="my-1.5">');

        // 3. 서로 잘 맞는 점 (상호보완 시너지)
        let synergy = "";
        if (myHA !== otHA) {
          synergy = `두 분의 위험회피 수준 차이는 가족이라는 배를 운전할 때 가장 안전한 안전판이 됩니다. 한 분이 신중한 브레이크 역할을 해주고, 다른 한 분이 주저앉지 않고 앞으로 나아가는 추진력이 되어줍니다.`;
        } else if (myCO >= 4 || otCO >= 4) {
          synergy = `연대감(CO) 지수가 높아, 비록 겉으로 서운함을 표현할 때가 있더라도 가족 구성원을 끝까지 버리지 않고 지켜내려는 근본적인 이타심과 희생정신을 서로 깊이 신뢰하고 있습니다.`;
        } else if (myST >= 4 || otST >= 4) {
          synergy = `삶의 시련과 고통을 더 큰 인생의 흐름 속에서 이해하려는 영적·철학적 성숙도(자기초월 ST)를 공유하여, 깊은 사색과 침묵 속에서도 서로를 안쓰럽게 여기는 묵직한 유대감이 존재합니다.`;
        } else {
          synergy = `각자의 독립적인 영역을 지켜주면서도, 위기 상황이 닥치면 현실적인 문제 해결을 위해 일사불란하게 뜻을 모을 수 있는 실용적 팀워크를 발휘합니다.`;
        }

        // 4. [핵심] 결과 데이터에 따른 정밀 맞춤 솔루션 및 대화 처방전
        let solution = "";
        if (!isReal) {
          // 상대방 미검사 시: 오진을 방지하는 안전하고 보편적인 임시 완충 처방
          solution = `
            <div class="space-y-2">
              <p class="text-amber-950 font-bold">🛡️ [검사 전 잠정 안전 처방: 상대방을 방어적으로 만들지 않는 소통법]</p>
              <ul class="list-disc list-inside text-gray-700 space-y-1">
                <li>${target.name} 님이 아직 검사를 받지 않았으므로, <strong>'당신은 이런 성격이니까 문제야'라는 식의 단정을 절대 금지</strong>합니다.</li>
                <li>대화할 때는 <strong>"나-전달법(I-Message)"</strong>을 쓰세요. "당신 왜 그래?"가 아니라, <em>"${target.name} 님이 그렇게 말할 때 내 마음이 좀 섭섭하고 걱정되었어"</em>라고 내 감정만 담백하게 전하세요.</li>
                <li><strong>권유 사항</strong>: ${target.name} 님께 이 검사를 링크로 전달하여 직접 풀어보시게 하세요. 응답 결과가 저장되는 즉시 두 분만을 위한 정밀 대화 스크립트로 자동 업데이트됩니다.</li>
              </ul>
            </div>
          `;
        } else {
          // 양측 실측 완료 시: 기질과 MBTI 조합별 구체적 1:1 행동 솔루션
          let specificTip = "";
          if (myT_F === 'T' && otT_F === 'F') {
            specificTip = `<strong>[실전 대화 팁]</strong> ${target.name} 님이 힘든 이야기를 꺼낼 때, "그건 네가 이렇게 했어야지"라는 해결책을 3분간 꾹 삼키세요. 대신 <em>"정말 힘들었겠구나, 마음고생 많았어"</em>라는 공감의 문장 하나를 먼저 건넨 뒤에 현실 조언을 하세요.`;
          } else if (myT_F === 'F' && otT_F === 'T') {
            specificTip = `<strong>[실전 대화 팁]</strong> ${target.name} 님이 무뚝뚝하게 단답형으로 말하거나 직설적인 조언을 건넬 때, <em>'나를 미워해서가 아니라, 저 사람은 원래 문제를 해결하는 것으로 애정을 표현하는 사람이다'</em>라고 머릿속으로 번역기를 돌려보세요.`;
          } else if (myRD >= 4 && otRD <= 2) {
            specificTip = `<strong>[정서 조율 팁]</strong> ${target.name} 님에게서 극적인 칭찬이나 다정한 표현을 기대하기보다, 묵묵히 자리를 지켜주거나 실질적인 도움을 주는 행동 자체를 '그 사람만의 사랑 고백'으로 인정해 주는 관점의 전환이 필요합니다.`;
          } else {
            specificTip = `<strong>[관계 조율 팁]</strong> 서로의 기질적 취약점을 자극하지 않도록, 대화가 과열될 때는 <em>"지금 우리 둘 다 피곤한 것 같으니 30분 뒤에 다시 이야기하자"</em>는 타임아웃 규칙을 합의하세요.`;
          }

          solution = `
            <div class="space-y-2">
              <p class="text-emerald-950 font-bold">🎯 [양측 실측 데이터 기반 1:1 맞춤 실천 가이드]</p>
              <div class="p-3 bg-white rounded-xl border border-emerald-200 text-gray-800">
                ${specificTip}
              </div>
              <p class="text-xs text-gray-600 mt-1">
                두 분의 실측 기질 매칭 결과, 상대방을 비난하지 않고 각자의 기질적 한계를 '있는 그대로' 품어줄 때 가장 안전한 심리적 회복이 시작됩니다.
              </p>
            </div>
          `;
        }

        return { tciClash, friction, synergy, solution };
      }
    };

    // 앱 초기 가동
    window.onload = function() {
      appState.init();
    };
  </script>
</body>
</html>
