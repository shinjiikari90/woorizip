  <style>
    /* 어르신 및 모바일 최적화: 가독성 극대화 및 줄바꿈 보정 */
    * {
      word-break: keep-all;
      overflow-wrap: break-word;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: linear-gradient(135deg, #fef9f3 0%, #edfbf7 100%);

    }
    .custom-scrollbar::-webkit-scrollbar {

    }

      <p class="font-medium">이용후 님 · 이동애 님 · 이주희 님 · 이종석 님 전용 힐링 스페이스</p>
      <p class="text-[11px] text-gray-500">본 검사는 표준 심리생리 척도, MBTI 및 TCI(기질 및 성격검사) 이론을 융합한 가족 맞춤형 임상 분석 엔진입니다.</p>

    /* ========================================================
       가족별 실제 검사 완료 데이터 저장소 (LocalStorage 동기화)
       ======================================================== */
    const STORAGE_KEY = 'family_clinic_records_v1';
    function loadSavedRecords() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : {};
      } catch (e) {
        return {};
      }
    }
    function saveMemberRecord(memberId, results) {
      try {
        const records = loadSavedRecords();
        records[memberId] = {
          completedAt: new Date().toLocaleDateString('ko-KR'),
          results: results
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      } catch (e) {
        console.error(e);
      }
    }

    const appState = {
      currentView: 'home', // 'home' | 'intro' | 'survey' | 'result'
      currentMember: null,
      currentQuestionIdx: 0,
      answers: {}, // { questionId: score (1~5) }
      chartInstance: null,

      init() {
        this.render();
      },

      selectMember(memberId) {
        this.currentMember = FAMILY_MEMBERS[memberId];
        this.currentQuestionIdx = 0;
        this.answers = {};
        this.currentView = 'intro';
        this.render();
      },

      startSurvey() {
        this.currentView = 'survey';
        this.currentQuestionIdx = 0;
        this.answers = {};
        this.render();
      },

      answerQuestion(score) {
        const q = QUESTION_BANK[this.currentQuestionIdx];
        this.answers[q.id] = score;

        if (this.currentQuestionIdx < QUESTION_BANK.length - 1) {
          this.currentQuestionIdx++;
          this.render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          this.finishSurvey();
        }
      },

      prevQuestion() {
        if (this.currentQuestionIdx > 0) {
          this.currentQuestionIdx--;
          this.render();
        }
      },

      finishSurvey() {
        this.currentView = 'result';
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      goToHome() {
        if (this.chartInstance) {
          this.chartInstance.destroy();
          this.chartInstance = null;
        }
        this.currentView = 'home';
        this.currentMember = null;
        this.currentQuestionIdx = 0;
        this.answers = {};
        this.render();
      },

      render() {
        const main = document.getElementById('mainContent');
        const headerResetBtn = document.getElementById('headerResetBtn');

        if (this.currentView === 'home') {
          headerResetBtn.classList.add('hidden');
          main.innerHTML = this.renderHomeView();
        } else if (this.currentView === 'intro') {
          headerResetBtn.classList.remove('hidden');
          main.innerHTML = this.renderIntroView();
        } else if (this.currentView === 'survey') {
          headerResetBtn.classList.remove('hidden');
          main.innerHTML = this.renderSurveyView();
        } else if (this.currentView === 'result') {
          headerResetBtn.classList.remove('hidden');
          main.innerHTML = this.renderResultView();
          this.initResultChart();
        }
      },

      /* ----------------------------------------------------
         점수 계산 및 검사 결과 도출
         ---------------------------------------------------- */
      calculateResults() {
        const ans = this.answers;
        const m = this.currentMember;

        let tensionRaw = 0, tensionCnt = 0;
        let depressRaw = 0, depressCnt = 0;
        let somaticRaw = 0, somaticCnt = 0;
        let famStressRaw = 0, famStressCnt = 0;
        let eiScore = 0, snScore = 0, tfScore = 0, jpScore = 0;

        let nsScore = 0, haScore = 0, rdScore = 0, pScore = 0;
        let sdScore = 0, coScore = 0, stScore = 0;

        QUESTION_BANK.forEach(q => {
          const val = ans[q.id] || 3;
          if (q.category === 'bio_tension') { tensionRaw += val; tensionCnt++; }
          if (q.category === 'bio_depress') { depressRaw += val; depressCnt++; }
          if (q.category === 'bio_somatic') { somaticRaw += val; somaticCnt++; }
          if (q.category === 'bio_load') { somaticRaw += val; somaticCnt++; }
          if (q.category === 'fam_stress') { famStressRaw += val; famStressCnt++; }

          if (q.category === 'mbti_EI') eiScore += val;
          if (q.category === 'mbti_SN') snScore += val;
          if (q.category === 'mbti_TF') tfScore += val;
          if (q.category === 'mbti_JP') jpScore += val;

          if (q.category === 'tci_NS') nsScore += val;
          if (q.category === 'tci_HA') haScore += val;
          if (q.category === 'tci_RD') rdScore += val;
          if (q.category === 'tci_RD_REV') rdScore += (6 - val);
          if (q.category === 'tci_P') pScore += val;
          if (q.category === 'tci_SD') sdScore += val;
          if (q.category === 'tci_CO') coScore += val;
          if (q.category === 'tci_ST') stScore += val;
        });

        const tension = Math.min(100, Math.round(((tensionRaw / (tensionCnt || 1)) / 5) * 100));
        const somatic = Math.min(100, Math.round(((somaticRaw / (somaticCnt || 1)) / 5) * 100));
        const depression = Math.min(100, Math.round(((depressRaw / (depressCnt || 1)) / 5) * 100));
        const stress = Math.min(100, Math.round(((famStressRaw / (famStressCnt || 1)) / 5) * 100));
        const resilience = Math.max(30, 100 - Math.round((tension + stress + depression) / 3 * 0.7));

        const mbti = (eiScore >= 24 ? "I" : "E") +
                     (snScore >= 24 ? "S" : "N") +
                     (tfScore >= 28 ? "T" : "F") +
                     (jpScore >= 28 ? "J" : "P");

        const getTciLevel = (score, max) => {
          const ratio = score / max;
          if (ratio >= 0.8) return "초고(Very High)";
          if (ratio >= 0.65) return "고(High)";
          if (ratio >= 0.45) return "중(Mid)";
          if (ratio >= 0.3) return "중저(Mid-Low)";
          return "저(Low)";
        };

        const tci = {
          NS: getTciLevel(nsScore, 20),
          HA: getTciLevel(haScore, 25),
          RD: getTciLevel(rdScore, 20),
          P: getTciLevel(pScore, 15),
          SD: getTciLevel(sdScore, 15),
          CO: getTciLevel(coScore, 15),
          ST: getTciLevel(stScore, 15)
        };

        return {
          scores: {
            '자율신경 긴장도': tension,
            '신체화 반응': somatic,
            '정서 침체도': depression,
            '가족 스트레스': stress,
            '심리적 회복탄력성': resilience
          },
          mbti: mbti || m.mbtiDefault,
          tci: tci
        };
      },

      finishSurvey() {
        const results = this.calculateResults();
        saveMemberRecord(this.currentMember.id, results);
        this.cachedResult = results;
        this.currentView = 'result';
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      /* ----------------------------------------------------

      initResultChart() {
        setTimeout(() => {
          const ctx = document.getElementById('bioChart');
          if (!ctx) return;
          if (this.chartInstance) {
            this.chartInstance.destroy();
          }

          const res = this.cachedResult || this.calculateResults();
          const labels = Object.keys(res.scores);
          const dataValues = Object.values(res.scores);

          this.chartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
              labels: labels,
              datasets: [{
                label: `${this.currentMember.name} 님의 심리생리 상태`,
                data: dataValues,
                backgroundColor: 'rgba(249, 115, 22, 0.2)',
                borderColor: 'rgba(234, 88, 12, 1)',
                pointBackgroundColor: 'rgba(234, 88, 12, 1)',
                pointBorderColor: '#fff',
                pointHoverBackgroundColor: '#fff',
                pointHoverBorderColor: 'rgba(234, 88, 12, 1)',
                borderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              scales: {
                r: {
                  angleLines: { color: '#e5e7eb' },
                  grid: { color: '#e5e7eb' },
                  suggestedMin: 0,
                  suggestedMax: 100,
                  ticks: { stepSize: 20, display: false },
                  pointLabels: {
                    font: { size: 12, weight: 'bold' },
                    color: '#374151'
                  }
                }
              },
              plugins: {
                legend: { display: false }
              }
            }
          });
        }, 50);
      },

                </p>
                <p class="text-sm sm:text-base text-gray-800 font-medium leading-relaxed">
                  ${relationData.tciClash}
                </p>
              </div>

              <!-- 마찰 포인트 -->
              <div class="p-4 bg-rose-50/80 rounded-2xl border border-rose-100 space-y-1">
                <p class="text-sm font-extrabold text-rose-900 flex items-center">
                  <span class="mr-1.5">🔥</span> 구체적 마찰 원인 (실측 대입)
                </p>
                <p class="text-sm sm:text-base text-gray-800 font-medium leading-relaxed">
                  ${relationData.friction}
                </p>
              </div>

              <!-- 잘 맞는 점 (상호보완) -->
              <div class="p-4 bg-emerald-50/80 rounded-2xl border border-emerald-100 space-y-1">
                <p class="text-sm font-extrabold text-emerald-900 flex items-center">
                  <span class="mr-1.5">✨</span> 서로 잘 맞는 점 & 상호보완
                </p>
                <p class="text-sm sm:text-base text-gray-800 font-medium leading-relaxed">
                  ${relationData.synergy}
                </p>
              </div>

              <!-- 해결책 & 실천 제안 -->
              <div class="p-4 bg-amber-50/80 rounded-2xl border border-amber-200 space-y-1">
                <p class="text-sm font-extrabold text-amber-950 flex items-center">
                  <span class="mr-1.5">💡</span> 상담사의 화해 솔루션 & 제안사항
                </p>
                <p class="text-sm sm:text-base text-gray-800 font-medium leading-relaxed">
                  ${relationData.solution}
                </p>
              </div>
            </div>
          `;
        }).join('');
      },

      /* ----------------------------------------------------
         [핵심 개선] 실제 검사 수치(TCI & MBTI)를 비교 연산하여
         결과에 따라 내용이 완전히 바뀌는 동적 임상 분석 엔진
         ---------------------------------------------------- */
      generateDynamicRelationInsight(me, myRes, target, targetData) {
        const myTci = myRes.tci;
        const otherTci = targetData.tci;
        const myMbti = myRes.mbti;
        const otherMbti = targetData.mbti;

        // 레벨을 수치형태(1~5)로 변환해 크기 비교
        const levelScore = (lvl) => {
          if (!lvl) return 3;
          if (lvl.includes('초고')) return 5;
          if (lvl.includes('고')) return 4;
          if (lvl.includes('중저')) return 2;
          if (lvl.includes('저')) return 1;
          return 3;
        };

        const myNS = levelScore(myTci.NS);
        const otNS = levelScore(otherTci.NS);
        const myHA = levelScore(myTci.HA);
        const otHA = levelScore(otherTci.HA);
        const myRD = levelScore(myTci.RD);
        const otRD = levelScore(otherTci.RD);
        const mySD = levelScore(myTci.SD);
        const otSD = levelScore(otherTci.SD);

        // MBTI 4축 개별 지표 추출
        const myE_I = myMbti[0], otE_I = otherMbti[0];
        const myS_N = myMbti[1], otS_N = otherMbti[1];
        const myT_F = myMbti[2], otT_F = otherMbti[2];
        const myJ_P = myMbti[3], otJ_P = otherMbti[3];

        // 1. TCI 기반 갈등 메커니즘 동적 합성 (실측 기질 격차 기반)
        let tciClash = "";
        if (Math.abs(myRD - otRD) >= 2) {
          // 정서적 보상의존(RD) 격차가 큰 경우
          const highRdPerson = myRD > otRD ? me.name : target.name;
          const lowRdPerson = myRD > otRD ? target.name : me.name;
          tciClash = `【정서 교감의 비대칭 (RD 격차)】 실측 결과 ${me.name} 님의 보상의존은 [${myTci.RD}], ${target.name} 님은 [${otherTci.RD}]로 정서적 온도 차가 큽니다. 따뜻한 공감과 애정 표현을 갈망하는 ${highRdPerson} 님에 비해, ${lowRdPerson} 님은 감정 표현이 담백하거나 속으로 삭이는 편이어서 ${highRdPerson} 님이 ‘나를 인정해주지 않거나 무관심하다’는 소외감을 느끼기 쉽습니다.`;
        } else if (myHA >= 4 && otHA >= 4) {
          // 둘 다 위험회피(HA)가 높은 경우
          tciClash = `【불안 공명 증폭 (상호 고HA)】 두 분 모두 위험회피 성향이 [${myTci.HA}]와 [${otherTci.HA}]로 매우 높게 나타났습니다. 한 사람이 건강이나 가족 문제에 대한 염려를 꺼내면, 상대방이 이를 차분히 받아주기보다 함께 예기불안이 전염되어 집안 분위기가 급속도로 긴장 상태로 얼어붙는 '불안의 되먹임 현상'이 일어납니다.`;
        } else if (Math.abs(myNS - otNS) >= 2) {
          // 자극추구(NS) 격차가 큰 경우
          const highNs = myNS > otNS ? me.name : target.name;
          const lowNs = myNS > otNS ? target.name : me.name;
          tciClash = `【삶의 템포와 안정성 갈등 (NS 격차)】 자극추구에서 ${me.name} 님([${myTci.NS}])과 ${target.name} 님([${otherTci.NS}])의 차이가 두드러집니다. 새로운 시도나 변화를 모색하려는 ${highNs} 님에 대해, 기존의 익숙한 방식과 안정을 지키려는 ${lowNs} 님이 방어적인 제동을 걸면서 "답답하다" vs "불안하고 위태롭다"는 대립이 발생합니다.`;
        } else {
          tciClash = `【내면의 자율성과 완벽주의 충돌】 ${me.name} 님([자율성 ${myTci.SD}])과 ${target.name} 님([자율성 ${otherTci.SD}])의 관계에서, 서로의 책임 방식이나 독립성에 대한 기대치가 부딪힐 때 침묵이나 방어적 태도로 갈등이 표출될 가능성이 있습니다.`;
        }

        // 2. MBTI 4대 축(E/I, S/N, T/F, J/P) 전방위 실측 궁합 및 마찰 분석
        let mbtiFrictionPoints = [];

        // 축 1: T vs F (판단 방식: 사고 vs 감정)
        if (myT_F === 'T' && otT_F === 'F') {
          mbtiFrictionPoints.push(`[T-F 판단 충돌] ${me.name} 님은 논리적 인과관계와 현실적인 해결책(T)을 앞세우는 반면, ${target.name} 님은 힘든 감정 자체에 대한 공감과 지지(F)를 먼저 원합니다. 바른말을 해주고도 상대방에게 상처를 주는 오해가 생기기 쉽습니다.`);
        } else if (myT_F === 'F' && otT_F === 'T') {
          mbtiFrictionPoints.push(`[F-T 판단 충돌] ${me.name} 님은 속상한 마음을 따뜻하게 안아주길(F) 바라지만, ${target.name} 님은 원인 규명과 차가운 조언(T)을 직설적으로 건네어 ${me.name} 님의 마음에 깊은 생채기를 낼 수 있습니다.`);
        } else if (myT_F === 'T' && otT_F === 'T') {
          mbtiFrictionPoints.push(`[T-T 이성적 평행선] 두 분 모두 논리적이고 원칙주의적인(T) 성향으로, 의견 충돌 시 서로 정서적 양보를 하지 않아 차가운 침묵과 단절로 흐를 수 있습니다.`);
        } else {
          mbtiFrictionPoints.push(`[F-F 배려의 역설] 두 분 모두 마음이 여리고 감수성이 풍부한(F) 성향으로, 서로에게 상처를 주지 않으려다 정작 중요한 서운함을 제때 말하지 못하고 속병을 앓게 됩니다.`);
        }

        // 축 2: J vs P (생활 방식: 체계성 vs 유연성)
        if (myJ_P === 'J' && otJ_P === 'P') {
          mbtiFrictionPoints.push(`[J-P 생활양식 차이] 계획과 사전 정돈을 중시하는 ${me.name} 님(J)의 입장에서, 상황에 맞춰 유연하게 대처하려는 ${target.name} 님(P)의 방식이 다소 불안정하거나 즉흥적으로 비쳐 스트레스를 받을 수 있습니다.`);
        } else if (myJ_P === 'P' && otJ_P === 'J') {
          mbtiFrictionPoints.push(`[P-J 생활양식 차이] 자유롭고 유연한 흐름을 선호하는 ${me.name} 님(P)에게, 모든 것을 미리 정해두고 통제하려는 ${target.name} 님(J)의 엄격한 규칙이 구속감이나 답답함으로 느껴질 수 있습니다.`);
        }

        // 축 3: S vs N (인식 방식: 구체적 현실 vs 미래 직관)
        if (myS_N !== otS_N) {
          const sPerson = myS_N === 'S' ? me.name : target.name;
          const nPerson = myS_N === 'N' ? me.name : target.name;
          mbtiFrictionPoints.push(`[S-N 소통 방식 차이] 눈앞의 구체적인 사실과 실천을 중시하는 ${sPerson} 님(S)과, 행간의 의미나 미래 가능성을 넓게 바라보는 ${nPerson} 님(N) 간에 대화의 초점이 엇갈릴 수 있습니다.`);
        }

        const friction = mbtiFrictionPoints.join('<br class="my-1">');

        // 3. 서사 및 기질 융합 상호보완(시너지) 동적 도출
        let synergy = "";
        if (myHA !== otHA) {
          synergy = `위험회피 성향의 차이([${myTci.HA}] vs [${otherTci.HA}])는 위기 상황에서 한 사람은 브레이크(신중한 안전판)가 되어주고, 다른 한 사람은 가속 페달(결단과 용기)이 되어줄 수 있는 이상적인 상호보완의 조합입니다.`;
        } else if (myE_I !== otE_I) {
          synergy = `내향성(I)과 외향성(E)의 조화로, 한 사람은 가족 내면의 평온한 쉼터를 가꾸고 다른 한 사람은 외부 세상과의 활기찬 소통 창구가 되어줄 수 있습니다.`;
        } else {
          synergy = `두 분의 내면 가치관과 가족을 향한 근본적인 애착의 깊이가 서로를 향해 있어, 한 번 마음의 벽을 허물면 누구보다 끈끈한 심리적 동지가 될 수 있습니다.`;
        }

        // 4. 맞춤 솔루션
        let solution = "";
        if (myT_F !== otT_F) {
          solution = `대화할 때 <strong>‘공감 먼저, 해결은 나중에’</strong> 원칙을 지켜보세요. 상대방의 말에 대해 “그랬구나, 참 힘들었겠네”라는 10초의 맞장구를 먼저 건네는 것만으로도 대화의 온도가 180도 달라집니다.`;
        } else if (myRD < 3 && otRD >= 4) {
          solution = `${target.name} 님에게는 ‘구체적이고 다정한 인정의 말’이 최고의 보약입니다. 무뚝뚝한 침묵 대신 짧은 안부 문자나 ‘애썼다, 고맙다’는 한마디를 주기적으로 전해주세요.`;
        } else if (myJ_P !== otJ_P) {
          solution = `계획과 틀을 맞추려 다투기보다는 '각자의 생활 리듬을 존중하는 여백'을 두는 것이 좋습니다. 마감 시간이나 약속은 명확히 정하되, 그 과정은 상대방의 스타일에 맡겨보세요.`;
        } else {
          solution = `서로의 성격을 억지로 뜯어고치려 하지 말고, 각자가 살아온 방식과 타고난 기질의 차이를 ‘틀린 것이 아니라 다른 것’으로 인정하는 심리적 거리두기 연습이 필요합니다.`;
        }

        return { tciClash, friction, synergy, solution };
      }
    };

    // 앱 초기 가동
    window.onload = function() {
      appState.init();
    };
  </script>
</body>
